[package]
name = "max-core"
version = "0.1.0"
description = "MAX client core: session setup, login flows (QR, SMS code, 2FA password), sync and reconnect"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.2"
max-identity = { path = "../max-identity" }
max-proto = { path = "../max-proto" }
max-store = { path = "../max-store" }
max-transport = { path = "../max-transport" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
zeroize = "1.9.2"

[dev-dependencies]
rmpv = "1.3.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
