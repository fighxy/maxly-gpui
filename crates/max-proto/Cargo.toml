[package]
name = "max-proto"
version = "0.1.0"
description = "Wire format of the MAX messenger desktop protocol: frames, lz4, msgpack, opcodes, packets"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.2"
lz4_flex = { version = "0.14.2", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
