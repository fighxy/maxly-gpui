[workspace]
resolver = "3"
members = ["crates/max-proto", "crates/max-transport", "crates/max-identity", "crates/max-store", "crates/max-core", "crates/max-lottie", "crates/app"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
