[package]
name = "maxly-gpui"
version = "0.1.0"
description = "Telemetry-free MAX desktop client (gpui + gpui-kit)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "maxly-gpui"
path = "src/main.rs"

[dependencies]
bytes = "1.12.2"
dirs = "7.0.0"
gpui-kit = "=0.10.0"
# Same version GPUI decodes with; used to rebuild a rotated frame for the photo viewer.
image = { version = "0.25.9", default-features = false }
jiff = "1.0.1"
max-core = { path = "../max-core" }
max-lottie = { path = "../max-lottie" }
max-identity = { path = "../max-identity" }
max-proto = { path = "../max-proto" }
max-store = { path = "../max-store" }
max-transport = { version = "0.1.0", path = "../max-transport" }
qrcode = { version = "0.15.0", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
zeroize = "1.9.2"

[dev-dependencies]
rmpv = "1.3.1"

# Desktop integration without unsafe code of our own.
# Windows: tray-icon plus safe Win32 wrappers (GPUI cannot hide a window there).
# Linux: the same tray crate over the StatusNotifier protocol (ksni). Arch does not need
# libappindicator; a desktop that speaks StatusNotifier (KDE, swaybar, waybar, GNOME with
# the AppIndicator extension) shows the icon.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
winsafe = { version = "0.0.29", features = ["user"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
