[package]
name = "maxrs"
version = "0.1.0"
description = "Telemetry-free MAX desktop client (gpui + gpui-kit)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "maxrs"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.10.0"
jiff = "1.0.1"
max-core = { path = "../max-core" }
max-identity = { path = "../max-identity" }
max-proto = { path = "../max-proto" }
max-store = { path = "../max-store" }
max-transport = { version = "0.1.0", path = "../max-transport" }
qrcode = { version = "0.15.0", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
zeroize = "1.9.2"

[dev-dependencies]
rmpv = "1.3.1"
